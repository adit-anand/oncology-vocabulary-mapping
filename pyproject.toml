[project]
name = "ohdsi-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "en-core-sci-scibert",
    "medspacy>=1.3.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "spacy>=3.8.16",
    "spacy-transformers>=1.4.0",
]

[project.scripts]
ohdsi-2026 = "ohdsi_2026:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# en-core-sci-scibert-0.5.4 (the last scispaCy release with published model weights)
# declares "spacy<3.8.0,>=3.7.4" in its own metadata, predating spaCy 3.8. This
# project requires spacy>=3.8.16 (itself required by medspacy>=1.3.1 on Python
# >=3.12, see spancat_config.cfg). The override below forces the resolver to
# ignore that stale upper bound; the model's weights/tokenizer/config are known
# to load fine under spaCy 3.8.x.
override-dependencies = ["spacy>=3.8.16,<4"]

[tool.uv.sources]
en-core-sci-scibert = { url = "https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_scibert-0.5.4.tar.gz" }
